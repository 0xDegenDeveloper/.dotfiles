unbind r
bind r source-file ~/.tmux.conf

# Change leader to C-s
set -g prefix C-b

# Mouse support
set -g mouse on

# Better pane splits
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

#Enable extended keys so tmux passes through modified Enter/Tab/etc.
#set -g extended-keys on

# Vi keys in copy mode (v to select, y to yank). Matches Neovim.
set-window-option -g mode-keys vi

# Used by copy-pipe bindings. tmux-yank pipes y / mouse release through this.
set -s copy-command 'pbcopy'

# Enter is still the default copy-selection binding; send it to the clipboard too.
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# statusbar
set -g status-position top

# prefix + r reloads this file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Plugins (TPM). Install: prefix + I
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
