unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Change leader to C-s
set -g prefix C-b

# Mouse support
set -g mouse on

# Better pane splits
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Start windows/panes at 1. Existing windows keep old indexes until
# `tmux move-window -r` (or a new session).
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

#Enable extended keys so tmux passes through modified Enter/Tab/etc.
#set -g extended-keys on

# Vi keys in copy mode (v to select, y to yank). Matches Neovim.
set-window-option -g mode-keys vi

# Used by copy-pipe bindings. tmux-yank pipes y / mouse release through this.
set -s copy-command 'pbcopy'

# Enter is still the default copy-selection binding; send it to the clipboard too.
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# statusbar
set -g status on
set -g status-position top
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
# Transparent gap between window tabs and the right module.
set -g @catppuccin_status_background "none"

# Plugins (TPM). Install: prefix + I
if-shell '[ -f "$HOME/.local/state/theme/current/tmux.conf" ]' \
  'source-file "$HOME/.local/state/theme/current/tmux.conf"' \
  'set -g @catppuccin_flavor "frappe"'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'

# Title chip (same pill as date). Must come after Catppuccin loads.
source "$HOME/.tmux/catppuccin-title.conf"
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_title}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
