# Prefix and configuration
set -g prefix C-b
set -g prefix2 None
bind , source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
bind r command-prompt -l -I '#W' 'rename-window -- "%%%"'
bind R command-prompt -l -I '#S' 'rename-session -- "%%%"'

# Panes, windows, and sessions
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy on
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy mode. OSC 52 reaches the attached terminal, including over SSH.
# On the local desktop, also use the native clipboard command when available.
setw -g mode-keys vi
set -s set-clipboard on
# Use a fixed slot so reloading does not append another entry.
set -s terminal-features[99] '*:clipboard'
set -s copy-command 'if [ -n "$SSH_CONNECTION" ]; then cat >/dev/null; elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null; then wl-copy; elif command -v pbcopy >/dev/null; then pbcopy; else cat >/dev/null; fi'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Built-in status bar
set -g status on
set -g status-position top

# TPM manages the tmux half of Neovim pane navigation.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
