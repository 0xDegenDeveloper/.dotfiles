# vim:set ft=tmux:
# Title chip, same shape as date_time.
#
# The left  MUST set fg and bg in one #[]. A separate #[bg=default] is
# dropped by the next #[fg=...], so the cap keeps a leftover green cell bg.
# bg=default is the transparent bar, not a painted color.
%hidden MODULE_NAME="title"

set -g @catppuccin_title_icon "󰓩 "
set -gF @catppuccin_title_color "#{@thm_lavender}"
set -g @catppuccin_title_text " #{E:set-titles-string}"

set -gF @catppuccin_status_title_icon_fg "#{@thm_crust}"
set -gF @catppuccin_status_title_icon_bg "#{@catppuccin_title_color}"

set -gF @catppuccin_status_title "#[fg=#{@catppuccin_status_title_icon_bg},bg=default]#{@catppuccin_status_left_separator}"
set -agF @catppuccin_status_title "#[fg=#{@catppuccin_status_title_icon_fg},bg=#{@catppuccin_status_title_icon_bg}]#{@catppuccin_title_icon}"
set -agF @catppuccin_status_title "#[fg=#{@thm_fg},bg=#{@thm_surface_0}]"
set -ag @catppuccin_status_title "#{E:@catppuccin_title_text}"
set -agF @catppuccin_status_title "#[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"
